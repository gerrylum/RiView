name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # pinned: a new stable can raise the toolchain minimums and break the build without warning
          # (the stable out on 2026-11-18 needs Gradle 9.3.1). Kept in step with the version used locally
          flutter-version: 3.47.6
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - run: flutter test --exclude-tags golden

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # pinned: a new stable can raise the toolchain minimums and break the build without warning
          # (the stable out on 2026-11-18 needs Gradle 9.3.1). Kept in step with the version used locally
          flutter-version: 3.47.6
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: opview-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # pinned: a new stable can raise the toolchain minimums and break the build without warning
          # (the stable out on 2026-11-18 needs Gradle 9.3.1). Kept in step with the version used locally
          flutter-version: 3.47.6
          cache: true

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign
